# One job per preflight profile; the logic lives in scripts/preflight.py (docs/project/ci.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/preflight.py docs-ci

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # A CPython of the layout the reader reads, for the test that reads a real process from
      # outside (crates/yata-reader/tests/real_cpython.rs); it does not replace the tooling Python.
      - uses: actions/setup-python@v7
        id: cpython311
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"
          update-environment: false
      - if: runner.os == 'Windows'
        shell: bash
        run: echo "YATA_TEST_PYTHON=${{ steps.cpython311.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: python scripts/preflight.py rust-ci

